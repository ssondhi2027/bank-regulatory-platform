notes:
- 'Consumed columns are contract-critical: a rename or removal is a hard failure. Non-consumed columns
  (including French-language duplicates) drift with a warning only.'
- Amount units are thousands of CAD and are IMPLICIT — the source carries no units column. Do not remove
  this note.
- Subtotal identification is NOT derivable from this file. It comes from the OSFI Data Dictionary hierarchy
  seed, keyed on the line-item code. See docs/known_data_issues.md.
- The natural key includes a derived variant_seq column (not a raw source column -- see the 'derived'
  entry under each return's columns list), computed by extract/keys.py::compute_variant_seq and ordered
  by (return_title, label_as_filed) per ADR-0002 -- NOT by label alone (ADR-0001's original clause). It
  disambiguates the same line item reported under two return definitions/accounting bases (e.g. IAS 39
  vs IFRS 9 wording). Must be computed identically in stg_osfi__filings via the same shared function.
  See docs/decisions/ADR-0001-natural-key.md, docs/decisions/ADR-0002-variant-ordering-and-quarantine.md,
  and seeds/seed_data_point_variants.csv.
- seeds/seed_quarantine.csv excludes Id 28017 at 2010-12-31 (P3 and E3) entirely -- every line item in
  that institution-period is duplicated with no distinguishing column, and row order was proven internally
  inconsistent across codes. No variant_seq pairing is trustworthy there. See docs/decisions/ADR-0002-variant-ordering-and-quarantine.md.
